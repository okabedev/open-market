# 버전 근거: docs/adr/0009-version-matrix.md
# Spring Boot·Spring Cloud BOM이 관리하는 라이브러리는 여기서 버전을 적지 않는다.

[versions]
java = "25"
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
querydsl = "7.7"
springdoc = "3.1.1"
archunit = "1.5.1"
shedlock = "7.10.1"
uuid-creator = "6.1.1"
zxing = "3.5.4"
twelvemonkeys = "3.15.2"
wiremock = "3.13.2"
opentelemetry-logback-appender = "2.32.0-alpha"
spotless = "8.10.4"
google-java-format = "1.36.1"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"
# 보안 패치: BOM이 고른 버전에 알려진 취약점이 있어 더 높은 버전으로 덮어쓴다(ADR 0009 "보안 패치").
# BOM을 올려 BOM 버전이 같거나 높아지면 지운다.
security-tomcat = "11.0.27"
security-jackson = "3.1.7"
security-jackson2 = "2.22.3"
# Spring Authorization Server 7.1.1은 Jackson 3.2.1을 요구한다. auth만 3.2 라인의 고친 버전을 쓴다.
security-jackson-auth = "3.2.3"
security-opentelemetry = "1.67.0"
# 안정 모듈과 같은 릴리스의 incubator 모듈(알파 BOM). 어긋나면 SDK가 뜨지 않는다
security-opentelemetry-alpha = "1.67.0-alpha"
security-freemarker = "2.3.35"
security-lz4 = "1.11.4"
security-snappy = "1.1.10.12"
security-guava = "33.7.2-jre"
security-httpclient = "4.5.14"
security-commons-lang3 = "3.20.0"

[libraries]
# BOM
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# 직접 고정
querydsl-jpa = { module = "io.github.openfeign.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "io.github.openfeign.querydsl:querydsl-apt", version.ref = "querydsl" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
shedlock-core = { module = "net.javacrumbs.shedlock:shedlock-core", version.ref = "shedlock" }
shedlock-jdbc = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
# 관리자 TOTP 등록 화면의 QR 코드(auth). 근거는 ADR 0024
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# 이미지 읽기(JPEG CMYK·EXIF, WebP). 근거는 ADR 0017
twelvemonkeys-imageio-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "twelvemonkeys" }
twelvemonkeys-imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
# 외부 HTTP API 흉내(서비스 간 호출, 토스). 근거는 ADR 0018
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-logback-appender" }

# 정적 분석 (convention 플러그인이 사용)
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# build-logic이 쓰는 Gradle 플러그인 아티팩트
gradle-plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
gradle-plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
gradle-plugin-errorprone = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }

# 보안 패치 (java-conventions가 제약으로 건다. 버전 근거는 ADR 0009)
security-tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "security-tomcat" }
security-tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "security-tomcat" }
security-tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "security-tomcat" }
security-jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "security-jackson" }
security-jackson-auth-bom = { module = "tools.jackson:jackson-bom", version.ref = "security-jackson-auth" }
security-jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "security-jackson2" }
security-opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "security-opentelemetry" }
security-opentelemetry-bom-alpha = { module = "io.opentelemetry:opentelemetry-bom-alpha", version.ref = "security-opentelemetry-alpha" }
security-freemarker = { module = "org.freemarker:freemarker", version.ref = "security-freemarker" }
security-lz4 = { module = "at.yawk.lz4:lz4-java", version.ref = "security-lz4" }
security-snappy = { module = "org.xerial.snappy:snappy-java", version.ref = "security-snappy" }
security-guava = { module = "com.google.guava:guava", version.ref = "security-guava" }
security-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "security-httpclient" }
# build-logic 클래스패스(Boot Gradle 플러그인 → commons-compress)
security-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "security-commons-lang3" }
