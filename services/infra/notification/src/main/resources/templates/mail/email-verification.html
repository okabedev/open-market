<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>이메일 인증</title>
  </head>
  <body style="font-family: system-ui, sans-serif; color: #1f2328; line-height: 1.6">
    <h1 style="font-size: 20px">이메일 인증을 완료해 주세요</h1>
    <p>오픈 마켓에 가입해 주셔서 감사합니다. 아래 버튼을 누르면 이메일 인증이 끝납니다.</p>
    <p>
      <a
        th:href="${verificationUrl}"
        style="display: inline-block; padding: 12px 20px; background: #1f6feb; color: #fff; border-radius: 8px; text-decoration: none"
        >이메일 인증하기</a
      >
    </p>
    <p>이 링크는 <strong th:text="${expiresAt}">만료 시각</strong>까지 한 번만 쓸 수 있습니다.</p>
    <p style="color: #57606a; font-size: 13px">직접 가입하지 않으셨다면 이 메일을 무시해 주세요.</p>
  </body>
</html>
