# 테스트 설정. config 서버와 Eureka 없이 뜨게 하고, config-repo(application.yml, notification.yml)가 줄 값을 대신한다.
# classpath:config/ 아래에 두어 main의 application.yml을 가리지 않고 그 위에 덮는다.
spring:
  cloud:
    config:
      enabled: false
  datasource:
    hikari:
      schema: notification
  flyway:
    schemas: notification
    default-schema: notification
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  # 이메일 발송 테스트는 Mailpit 컨테이너 주소로 덮는다. 다른 테스트는 메일을 보내지 않는다.
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      # 서비스 간 토큰. 테스트는 token-uri와 member 주소를 WireMock(MemberStub)으로 바꾼다.
      client:
        registration:
          notification:
            provider: auth
            client-id: notification
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          auth:
            token-uri: http://localhost:1/oauth2/token
      resourceserver:
        jwt:
          # 테스트는 spring-security-test의 jwt()로 인증을 넣어 디코더를 쓰지 않는다. 토큰 검증 자체는 common-security가 테스트한다.
          jwk-set-uri: http://localhost:1/oauth2/jwks
  # 아래 Kafka 값은 infra/config-repo/application.yml과 같게 둔다. 브로커 주소는 KafkaContainerConfiguration이 넣는다.
  kafka:
    consumer:
      auto-offset-reset: earliest
management:
  otlp:
    metrics:
      export:
        enabled: false
eureka:
  client:
    enabled: false
openmarket:
  notification:
    mail-from: "오픈 마켓 <no-reply@openmarket.local>"
    dispatch-interval: 200ms
    retention: 90d
    app-urls:
      shop: http://localhost:3000
      seller: http://localhost:3001
      admin: http://localhost:3002
    purge-interval: 1h
# 아래 OpenFeign·서킷 브레이커 값은 infra/config-repo/notification.yml과 같게 둔다.
spring.cloud:
  openfeign:
    oauth2:
      enabled: true
      client-registration-id: notification
    circuitbreaker:
      enabled: true
      alphanumeric-ids:
        enabled: true
    client:
      config:
        default:
          connect-timeout: 1000
          read-timeout: 2000
  circuitbreaker:
    resilience4j:
      disable-time-limiter: true
      disable-thread-pool: true
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
