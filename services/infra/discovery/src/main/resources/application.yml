# Eureka 서버 단일 노드. 다른 서비스보다 먼저 떠야 하므로 config 서버를 쓰지 않고 설정을 여기에 둔다.
server:
  port: 8761
spring:
  application:
    name: discovery
  threads:
    virtual:
      enabled: true
eureka:
  client:
    # 자기 자신을 등록하거나 다른 Eureka 노드에서 목록을 받지 않는다.
    register-with-eureka: false
    fetch-registry: false
  server:
    # 로컬에서는 서비스를 자주 껐다 켠다. 자기 보존 모드를 끄고, 갱신이 끊긴 인스턴스를 빨리 지운다.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
