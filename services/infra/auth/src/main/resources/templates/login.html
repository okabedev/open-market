<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 - 오픈 마켓</title>
    <style>
      /* 앱 3개의 디자인을 정하기 전의 최소 스타일. 외부 리소스를 불러오지 않는다. */
      body { font-family: system-ui, sans-serif; background: #f6f7f9; margin: 0; color: #1f2328; }
      main { max-width: 360px; margin: 10vh auto; padding: 32px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); }
      h1 { font-size: 1.4rem; margin: 0 0 24px; }
      label { display: block; font-size: 0.9rem; margin: 16px 0 6px; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 1rem; border: 1px solid #d0d7de; border-radius: 8px; }
      button { width: 100%; margin-top: 24px; padding: 12px; font-size: 1rem; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; cursor: pointer; }
      .message { margin: 0 0 16px; padding: 12px; border-radius: 8px; background: #fff1f0; color: #a40e26; font-size: 0.9rem; }
      .signup { margin-top: 20px; text-align: center; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>오픈 마켓 로그인</h1>
      <p class="message" role="alert" th:if="${message}" th:text="${message}">안내</p>
      <form method="post" th:action="@{/login}">
        <label for="username">이메일</label>
        <input id="username" name="username" type="email" autocomplete="username" required autofocus />
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">로그인</button>
      </form>
      <p class="signup">계정이 없으신가요? <a th:href="${signupUrl}">회원가입</a></p>
    </main>
  </body>
</html>
