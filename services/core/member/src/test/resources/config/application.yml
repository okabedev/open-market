# 테스트 설정. config 서버와 Eureka 없이 뜨게 하고, config-repo가 줄 데이터 설정을 대신한다.
# classpath:config/ 아래에 두어 main의 application.yml을 가리지 않고 그 위에 덮는다.
spring:
  cloud:
    config:
      enabled: false
  datasource:
    hikari:
      # 공통 라이브러리의 JDBC 쿼리는 스키마 이름을 쓰지 않으므로 연결의 search_path를 서비스 스키마로 둔다.
      schema: member
  flyway:
    schemas: member
    default-schema: member
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: member
  security:
    oauth2:
      # 서비스 간 토큰. token-uri는 테스트가 WireMock 주소로 덮는다(WithdrawalIntegrationTest).
      client:
        registration:
          member:
            provider: auth
            client-id: member
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          auth:
            token-uri: http://localhost:1/oauth2/token
      resourceserver:
        jwt:
          # 테스트는 spring-security-test의 jwt()로 인증을 넣어 디코더를 쓰지 않는다. 토큰 검증 자체는 common-security가 테스트한다.
          jwk-set-uri: http://localhost:1/oauth2/jwks
  # 아래 Kafka·트레이싱 값은 infra/config-repo/application.yml과 같게 둔다. 브로커 주소는 KafkaContainerConfiguration이 넣는다.
  kafka:
    consumer:
      auto-offset-reset: earliest
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
eureka:
  client:
    enabled: false
openmarket:
  member:
    account-number-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# 아래 OpenFeign·서킷 브레이커 값은 infra/config-repo/member.yml과 같게 둔다.
spring.cloud:
  openfeign:
    oauth2:
      enabled: true
      client-registration-id: member
    circuitbreaker:
      enabled: true
      alphanumeric-ids:
        enabled: true
    client:
      config:
        default:
          connect-timeout: 1000
          read-timeout: 2000
  circuitbreaker:
    resilience4j:
      disable-time-limiter: true
      disable-thread-pool: true
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
