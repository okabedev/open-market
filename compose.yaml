# 레포 루트에서 `docker compose up -d`로 로컬 인프라를 띄운다. 실제 정의는 infra/compose에 있다.
# search, obs, apps profile은 `--profile`로 더한다(docs/dev-setup.md). e2e profile(가짜 PG)은 infra/e2e/run.sh만, load profile(k6)은 infra/k6/run.sh만, fault profile(Toxiproxy)은 infra/fault/run.sh만 쓴다.
# 루트 .env를 변수로 읽는다. 처음에는 `cp .env.example .env`.
name: openmarket

include:
  - path: infra/compose/compose.yaml
    env_file: .env
  - path: infra/compose/search.yaml
    env_file: .env
  - path: infra/compose/obs.yaml
    env_file: .env
  - path: infra/compose/apps.yaml
    env_file: .env
  - path: infra/compose/e2e.yaml
    env_file: .env
  - path: infra/compose/load.yaml
    env_file: .env
  - path: infra/compose/fault.yaml
    env_file: .env
