# Tempo 단일 바이너리(monolithic) 모드. 로컬 디스크에 저장한다. Kafka는 쓰지 않는다.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# 보존 기간 7일. 스케줄러와 워커가 각자 compaction 설정을 가지므로 둘 다 맞춘다.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

backend_worker:
  compaction:
    block_retention: 168h

usage_report:
  reporting_enabled: false
