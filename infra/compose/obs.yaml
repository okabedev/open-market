# obs profile: 관측성 스택. `docker compose --profile obs up -d --wait`로 띄운다.
# 구성과 흐름은 docs/architecture/observability.md를 따른다. 설정 파일은 infra/observability와 infra/grafana에 있다.
# Collector, Tempo, Loki 이미지는 셸이 없다. Tempo는 내장 `-health`로 확인하고, Collector와 Loki는 healthcheck를 두지 않는다.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [obs]
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP (Spring 서비스 기본값)
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    image: grafana/tempo:3.1.0
    profiles: [obs]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 10s
      timeout: 5s
      retries: 30

  loki:
    image: grafana/loki:3.7.8
    profiles: [obs]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # 지표에 붙은 trace_id 예시값(exemplar)으로 Grafana에서 트레이스로 넘어간다.
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 복제 슬롯 상태(무효, 확인되지 않은 WAL)와 Postgres 통계를 Prometheus에 낸다. 계정은 infra/postgres/init/03-monitor.sh.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [obs]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/openmarket?sslmode=disable
      DATA_SOURCE_USER: monitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:?}
    mem_limit: 64m

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [obs]
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      mailpit:
        condition: service_healthy
    environment:
      # 로컬 전용이라 로그인 없이 관리자 권한으로 연다. 비밀 값이 없다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 기동 후 플러그인을 인터넷에서 최신 버전으로 받거나 올리지 않는다. 이미지에 든 플러그인만 쓴다.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # 알림 메일은 로컬 Mailpit(기본 profile)으로 보낸다. 받은 메일은 http://localhost:8025에서 본다.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@openmarket.local
      GF_SMTP_FROM_NAME: Open Market 알림
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      # 알림 메일의 링크 주소
      GF_SERVER_ROOT_URL: http://localhost:3003
    ports:
      - "3003:3000" # 3000~3002는 프론트 앱이 쓴다
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
