# apps profile: discovery, config, gateway, auth를 뺀 Spring 서비스. `docker compose --profile apps up -d --wait`로 띄운다.
# 전체 E2E용이다. 개발할 때는 작업 중인 서비스를 IDE로 띄우고, 같은 서비스 컨테이너는 멈춘다(docs/dev-setup.md).
# 이미지는 services/Dockerfile 하나로 만든다. 서비스를 추가하면 여기에 더한다(add-service skill).
# 메모리 상한과 힙 비율은 R6 실측 값이다(docs/architecture/risks.md).

# 서비스 공통 값. 서비스마다 `<<: *spring-service`로 합친다.
x-spring-service: &spring-service
  profiles: [apps]
  mem_limit: 640m
  # 서비스는 issuer 주소(auth.openmarket.local:9000)로 JWK를 받고 client_credentials 토큰을 요청한다. auth는 컨테이너든 IDE든 호스트 포트 9000에 있다(ADR 0013).
  extra_hosts:
    - "auth.openmarket.local:host-gateway"
  environment: &spring-env
    CONFIG_SERVER_URL: http://config:8888
    EUREKA_URL: http://discovery:8761/eureka/
    # 장애 주입(infra/fault/run.sh)만 toxiproxy를 준다. DB 연결이 프록시를 거쳐 지연을 넣을 수 있다.
    POSTGRES_HOST: ${SERVICE_POSTGRES_HOST:-postgres}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    OTEL_COLLECTOR_HOST: otel-collector
    # 컨테이너 표준 출력은 JSON(ECS) 한 줄씩. IDE·bootRun은 Boot 기본 텍스트 로그다.
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  member:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/member
    image: openmarket/member:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?}
      MEMBER_ACCOUNT_NUMBER_KEY: ${MEMBER_ACCOUNT_NUMBER_KEY:?}
      MEMBER_CLIENT_SECRET: ${MEMBER_CLIENT_SECRET:?}
    # 호스트에 포트를 열지 않는다. 바깥 요청은 gateway(8080)로 들어온다.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8101/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  catalog:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/catalog
    image: openmarket/catalog:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      # 상품 상세가 몰리는 서비스라 gateway처럼 ParallelGC를 쓴다(compose.yaml gateway 참고).
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=40 -XX:+UseParallelGC"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8102/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  order:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/order
    image: openmarket/order:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      ORDER_CLIENT_SECRET: ${ORDER_CLIENT_SECRET:?}
      # E2E(infra/e2e/run.sh)만 준다. 값이 없으면 컨테이너에 넘기지 않고 config-repo 기본값을 쓴다.
      ORDER_PAYMENT_TIMEOUT:
      ORDER_EXPIRY_INTERVAL:
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8103/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  payment:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/payment
    image: openmarket/payment:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?}
      # E2E(infra/e2e/run.sh)만 준다(가짜 PG 주소, 짧은 보상 취소 주기). 값이 없으면 넘기지 않고 config-repo 기본값을 쓴다.
      TOSS_API_URL:
      PAYMENT_CANCEL_INTERVAL:
      PAYMENT_REFUND_INTERVAL:
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8104/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  fulfillment:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/fulfillment
    image: openmarket/fulfillment:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      FULFILLMENT_DB_PASSWORD: ${FULFILLMENT_DB_PASSWORD:?}
      # E2E(infra/e2e/run.sh)만 준다(배송 시뮬레이터 지연, 자동 구매확정 기한). 값이 없으면 넘기지 않고 config-repo 기본값을 쓴다.
      FULFILLMENT_SIMULATOR_INTERVAL:
      FULFILLMENT_IN_TRANSIT_AFTER:
      FULFILLMENT_DELIVER_AFTER:
      FULFILLMENT_CONFIRM_INTERVAL:
      FULFILLMENT_AUTO_CONFIRM_AFTER:
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8105/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  promotion:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/promotion
    image: openmarket/promotion:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *spring-env
      PROMOTION_DB_PASSWORD: ${PROMOTION_DB_PASSWORD:?}
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8106/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  review:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/review
    image: openmarket/review:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8107/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  settlement:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/settlement
    image: openmarket/settlement:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?}
      # 정산 기간 길이와 마감 지연. E2E가 줄일 때만 넘긴다(config-repo settlement.yml 기본 7d, 3h).
      SETTLEMENT_PERIOD_LENGTH:
      SETTLEMENT_CLOSE_DELAY:
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8108/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  search:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/search
    image: openmarket/search:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      <<: *spring-env
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:?}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8109/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  notification:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: infra/notification
    image: openmarket/notification:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      <<: *spring-env
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?}
      MAIL_HOST: mailpit
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8202/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  file:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: infra/file
    image: openmarket/file:local
    # 이미지 처리 때문에 공통 값(640m)보다 크게 둔다(M2에 512m·힙 50%에서 정했다). 힙 밖 기본 사용량이 약 190MB라 512m에서는 큰 사진 동시 업로드 때
    # 익명 메모리가 상한에 닿아 스왑으로 밀렸다. 실측과 근거는 docs/architecture/risks.md "메모리 예산".
    mem_limit: 768m
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      FILE_DB_PASSWORD: ${FILE_DB_PASSWORD:?}
      FILE_STORAGE_ROOT: /data
      # 힙은 상한의 40%(약 307MB). 큰 쓰기의 임시 직접 버퍼(NIO)는 스레드마다 캐시하지 않는다.
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=40 -Djdk.nio.maxCachedBufferSize=262144"
    volumes:
      - file-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8201/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  # 업로드 파일. 이것만 지우면 파일 메타데이터(postgres-data)와 어긋난다.
  file-data:
