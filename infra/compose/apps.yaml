# apps profile: discovery, config, gateway, auth를 뺀 Spring 서비스. `docker compose --profile apps up -d --wait`로 띄운다.
# 전체 E2E용이다. 개발할 때는 작업 중인 서비스를 IDE로 띄우고, 같은 서비스 컨테이너는 멈춘다(docs/dev-setup.md).
# 이미지는 services/Dockerfile 하나로 만든다. 서비스를 추가하면 여기에 더한다(add-service skill).
# 메모리 상한과 힙 비율은 R6 실측 값이다(docs/architecture/risks.md).

# 서비스 공통 값. 서비스마다 `<<: *spring-service`로 합친다.
x-spring-service: &spring-service
  profiles: [apps]
  mem_limit: 512m
  # 서비스는 issuer 주소(auth.openmarket.local:9000)로 JWK를 받고 client_credentials 토큰을 요청한다. auth는 컨테이너든 IDE든 호스트 포트 9000에 있다(ADR 0013).
  extra_hosts:
    - "auth.openmarket.local:host-gateway"
  environment: &spring-env
    CONFIG_SERVER_URL: http://config:8888
    EUREKA_URL: http://discovery:8761/eureka/
    POSTGRES_HOST: postgres
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    OTEL_COLLECTOR_HOST: otel-collector
    # 컨테이너 표준 출력은 JSON(ECS) 한 줄씩. IDE·bootRun은 Boot 기본 텍스트 로그다.
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  member:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: core/member
    image: openmarket/member:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-env
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?}
    # 호스트에 포트를 열지 않는다. 바깥 요청은 gateway(8080)로 들어온다.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8101/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  notification:
    <<: *spring-service
    build:
      context: ../../services
      args:
        MODULE: infra/notification
    image: openmarket/notification:local
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      <<: *spring-env
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      MAIL_HOST: mailpit
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8202/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
