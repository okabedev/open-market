# 로컬 인프라. profile 구성은 docs/architecture/overview.md의 "로컬 실행 구성"을 따른다.
# 이 파일은 기본 profile(profile 없음)이다. search는 search.yaml, obs는 obs.yaml, apps는 apps.yaml에 있다.
# discovery, config, gateway, auth는 IDE로 띄우는 서비스도 항상 쓰므로 기본 profile에 둔다. 처음 up할 때 services/Dockerfile로 이미지를 빌드한다.
# 이미지 태그는 버전을 고정한다. JVM 컨테이너의 메모리 상한(mem_limit)은 R6 실측 값이다(docs/architecture/risks.md).
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: openmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?.env에 POSTGRES_SUPERUSER_PASSWORD가 필요하다}
      # 초기화 스크립트(infra/postgres/init)가 서비스 계정과 복제 계정을 만들 때 쓴다.
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      FULFILLMENT_DB_PASSWORD: ${FULFILLMENT_DB_PASSWORD:?}
      PROMOTION_DB_PASSWORD: ${PROMOTION_DB_PASSWORD:?}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      FILE_DB_PASSWORD: ${FILE_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      # Debezium이 멈춰 복제 슬롯이 WAL을 붙잡아도 디스크가 차지 않게 상한을 둔다(R5).
      # 장애 주입(infra/fault/run.sh)만 작게 줄여 슬롯 무효를 재현한다. 명령행 값은 ALTER SYSTEM보다 우선이라 변수로 받는다.
      - -c
      - max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-1GB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmarket"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: zaaFDXUcRo-Qbzi6ID-HHg # KRaft 클러스터 ID(base64 UUID). 로컬 고정값
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL은 컨테이너끼리, EXTERNAL은 호스트(IDE로 띄운 서비스)에서 쓴다.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 infra/kafka/topics에 선언해 만든다(docs/architecture/messaging.md).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  # 워커를 띄운 뒤 outbox 커넥터를 등록한다(infra/debezium/start.sh). healthy는 커넥터 태스크가 RUNNING이라는 뜻이다.
  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # 커넥터가 쓰는 토픽이 먼저 있어야 한다.
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/debezium-init/start.sh"]
    environment:
      CONNECT_URL: http://localhost:8083
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
      # 커넥터 설정의 ${env:DEBEZIUM_DB_PASSWORD}를 워커가 푼다. 등록한 설정과 REST 응답에는 자리 표시자만 남는다.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?}
      # Kafka가 잠깐 끊기면 워커가 그룹에서 빠졌다가 다시 들어온다. 기본값(5분)이면 그동안 태스크를 다시 받지 못해
      # 발행이 멈춘다. 워커가 하나뿐이라 기다릴 다른 워커가 없으므로 바로 재할당한다(docs/architecture/risks.md R5).
      CONNECT_SCHEDULED_REBALANCE_MAX_DELAY_MS: 0
    ports:
      - "8083:8083"
    volumes:
      - ../debezium:/debezium-init:ro
    healthcheck:
      # 태스크가 FAILED가 되면 unhealthy로 바뀐다. 원인은 `curl localhost:8083/connectors/outbox/status`로 본다.
      test: ["CMD", "bash", "/debezium-init/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 120s # 워커 기동과 커넥터 등록. 이 동안의 실패는 세지 않는다
      start_interval: 3s
      retries: 3

  # 일회성: infra/kafka/topics.txt의 토픽을 만들고 끝난다.
  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    entrypoint: ["/bin/bash", "/kafka-init/create-topics.sh"]
    volumes:
      - ../kafka:/kafka-init:ro
    restart: "no"

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # 웹 화면
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      # 상한이 없으면 VM 메모리의 25%를 힙으로 잡는다. Spring 서비스와 같은 기준으로 둔다(R6).
      JAVA_OPTS: -XX:MaxRAMPercentage=50
    mem_limit: 512m
    ports:
      - "8089:8080" # 8080은 gateway가 쓴다
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  discovery:
    build:
      context: ../../services
      args:
        MODULE: infra/discovery
    image: openmarket/discovery:local
    mem_limit: 640m # 힙 비율은 services/Dockerfile(R6)
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  config:
    build:
      context: ../../services
      args:
        MODULE: infra/config
    image: openmarket/config:local
    mem_limit: 640m # 힙 비율은 services/Dockerfile(R6)
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo/
      EUREKA_URL: http://discovery:8761/eureka/
    ports:
      - "8888:8888"
    volumes:
      # 저장소를 마운트하므로 config-repo를 고친 뒤 이미지를 다시 빌드할 필요가 없다. 서비스는 재시작하면 새 설정을 받는다.
      - ../config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 외부 진입점. 컨테이너에서는 IDE로 띄운 서비스(WSL IP)와 컨테이너 서비스 양쪽에 닿으므로 기본 profile에 둔다.
  # gateway 자체를 IDE로 띄울 때는 `docker compose stop gateway` 후 bootRun한다(docs/dev-setup.md).
  gateway:
    build:
      context: ../../services
      args:
        MODULE: infra/gateway
    image: openmarket/gateway:local
    mem_limit: 640m # 힙 비율은 services/Dockerfile(R6)
    depends_on:
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config:8888
      EUREKA_URL: http://discovery:8761/eureka/
      REDIS_HOST: redis
      OTEL_COLLECTOR_HOST: otel-collector
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # infra/compose/apps.yaml과 같다
      # 모든 요청이 지나므로 GC 멈춤이 곧 지연이다. 2GB 미만 컨테이너에서 JVM이 고르는 SerialGC 대신 여러 스레드로 짧게 멈추는
      # ParallelGC를 쓴다. 힙 비율은 services/Dockerfile과 같다(risks.md "부하 측정", R6).
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=40 -XX:+UseParallelGC"
      # E2E(infra/e2e/run.sh)만 준다. 값이 없으면 넘기지 않고 config-repo 기본값(1분에 5회)을 쓴다.
      GATEWAY_STRICT_RATE_LIMIT:
    # JWK를 issuer 주소로 받는다. auth가 컨테이너든 IDE든 호스트 포트 9000에 있다(ADR 0013).
    extra_hosts:
      - "auth.openmarket.local:host-gateway"
    ports:
      - "8080:8080"
      # 관리 포트(8081)는 호스트에 열지 않는다. Prometheus는 컨테이너 네트워크로 스크레이프한다.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 인가 서버. 로그인이 필요한 모든 흐름(BFF, gateway의 JWK 조회)이 쓰므로 기본 profile에 둔다.
  # issuer(http://auth.openmarket.local:9000)를 브라우저·IDE·컨테이너가 모두 호스트 포트 9000으로 닿는다(ADR 0013, R7).
  # - 브라우저·IDE: hosts 파일의 127.0.0.1 auth.openmarket.local
  # - 컨테이너: extra_hosts의 auth.openmarket.local → host-gateway (gateway, apps.yaml의 서비스)
  # auth 자체를 IDE로 띄울 때는 `docker compose stop auth` 후 bootRun한다. 다른 컨테이너는 고칠 것이 없다(docs/dev-setup.md).
  auth:
    build:
      context: ../../services
      args:
        MODULE: infra/auth
    image: openmarket/auth:local
    mem_limit: 640m # 힙 비율은 services/Dockerfile(R6)
    depends_on:
      config:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config:8888
      EUREKA_URL: http://discovery:8761/eureka/
      POSTGRES_HOST: ${SERVICE_POSTGRES_HOST:-postgres} # infra/compose/apps.yaml과 같다
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_COLLECTOR_HOST: otel-collector
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # infra/compose/apps.yaml과 같다
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      AUTH_SIGNING_KEY_SECRET: ${AUTH_SIGNING_KEY_SECRET:?.env에 AUTH_SIGNING_KEY_SECRET이 필요하다}
      AUTH_TOTP_SECRET_KEY: ${AUTH_TOTP_SECRET_KEY:?.env에 AUTH_TOTP_SECRET_KEY가 필요하다(.env.example 참고)}
      SHOP_CLIENT_SECRET: ${SHOP_CLIENT_SECRET:?}
      SELLER_CLIENT_SECRET: ${SELLER_CLIENT_SECRET:?}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET:?}
      MEMBER_CLIENT_SECRET: ${MEMBER_CLIENT_SECRET:?}
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?}
      ORDER_CLIENT_SECRET: ${ORDER_CLIENT_SECRET:?}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      # E2E(infra/e2e/run.sh)만 준다. 값이 없으면 넘기지 않고 config-repo 기본값(1분에 10회)을 쓴다.
      AUTH_LOGIN_RATE_LIMIT:
    ports:
      - "9000:9000"
      # 관리 포트(9001)는 호스트에 열지 않는다.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9001/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  kafka-data:
  redis-data:
