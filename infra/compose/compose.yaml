# 로컬 인프라. profile 구성은 docs/architecture/overview.md의 "로컬 실행 구성"을 따른다.
# 이 파일은 기본 profile(profile 없음)이다. search는 search.yaml, obs는 obs.yaml, apps는 apps.yaml에 있다.
# discovery, config, gateway는 IDE로 띄우는 서비스도 항상 쓰므로 기본 profile에 둔다. 처음 up할 때 services/Dockerfile로 이미지를 빌드한다.
# 이미지 태그는 버전을 고정한다. JVM 컨테이너의 메모리 상한(mem_limit)은 R6 실측 값이다(docs/architecture/risks.md).
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: openmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?.env에 POSTGRES_SUPERUSER_PASSWORD가 필요하다}
      # 초기화 스크립트(infra/postgres/init)가 서비스 계정과 복제 계정을 만들 때 쓴다.
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      FULFILLMENT_DB_PASSWORD: ${FULFILLMENT_DB_PASSWORD:?}
      PROMOTION_DB_PASSWORD: ${PROMOTION_DB_PASSWORD:?}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      FILE_DB_PASSWORD: ${FILE_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      # Debezium이 멈춰 복제 슬롯이 WAL을 붙잡아도 디스크가 차지 않게 상한을 둔다(R5).
      - -c
      - max_slot_wal_keep_size=1GB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmarket"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: zaaFDXUcRo-Qbzi6ID-HHg # KRaft 클러스터 ID(base64 UUID). 로컬 고정값
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL은 컨테이너끼리, EXTERNAL은 호스트(IDE로 띄운 서비스)에서 쓴다.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 infra/kafka/topics에 선언해 만든다(docs/architecture/messaging.md).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # 웹 화면
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      # 상한이 없으면 VM 메모리의 25%를 힙으로 잡는다. Spring 서비스와 같은 기준으로 둔다(R6).
      JAVA_OPTS: -XX:MaxRAMPercentage=50
    mem_limit: 512m
    ports:
      - "8089:8080" # 8080은 gateway가 쓴다
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  discovery:
    build:
      context: ../../services
      args:
        MODULE: infra/discovery
    image: openmarket/discovery:local
    mem_limit: 512m # 힙 비율은 services/Dockerfile(R6)
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  config:
    build:
      context: ../../services
      args:
        MODULE: infra/config
    image: openmarket/config:local
    mem_limit: 512m # 힙 비율은 services/Dockerfile(R6)
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo/
      EUREKA_URL: http://discovery:8761/eureka/
    ports:
      - "8888:8888"
    volumes:
      # 저장소를 마운트하므로 config-repo를 고친 뒤 이미지를 다시 빌드할 필요가 없다. 서비스는 재시작하면 새 설정을 받는다.
      - ../config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 외부 진입점. 컨테이너에서는 IDE로 띄운 서비스(WSL IP)와 컨테이너 서비스 양쪽에 닿으므로 기본 profile에 둔다.
  # gateway 자체를 IDE로 띄울 때는 `docker compose stop gateway` 후 bootRun한다(docs/dev-setup.md).
  gateway:
    build:
      context: ../../services
      args:
        MODULE: infra/gateway
    image: openmarket/gateway:local
    mem_limit: 512m # 힙 비율은 services/Dockerfile(R6)
    depends_on:
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config:8888
      EUREKA_URL: http://discovery:8761/eureka/
      REDIS_HOST: redis
    ports:
      - "8080:8080"
      # 관리 포트(8081)는 호스트에 열지 않는다. Prometheus는 컨테이너 네트워크로 스크레이프한다.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  kafka-data:
  redis-data:
