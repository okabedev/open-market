# search profile: Elasticsearch. `docker compose --profile search up -d --wait`로 띄운다.
# apps profile의 search 서비스가 쓰므로 apps profile에서도 뜬다.
# 공식 이미지에 nori 플러그인을 더한 커스텀 이미지다(infra/elasticsearch, R10).
services:
  elasticsearch:
    build:
      context: ../elasticsearch
    image: openmarket/elasticsearch:9.4.6
    profiles: [search, apps]
    environment:
      cluster.name: openmarket
      discovery.type: single-node
      # 로컬 전용이라 인증과 TLS를 끈다. 호스트에만 포트를 연다.
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      # 개발 PC 디스크가 차 있어도 인덱스가 읽기 전용으로 바뀌지 않게 한다.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  elasticsearch-data:
