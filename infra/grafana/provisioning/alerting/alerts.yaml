# Grafana 알림(NFR-10). 규칙, 연락처(Mailpit), 알림 정책을 파일로 둔다. 기준과 대응은 docs/architecture/observability.md "알림"에 있다.
# 규칙마다 A(Prometheus 즉시 쿼리)가 라벨별 값을 내고 B(임계값)가 조건이다. 라벨별로 따로 알림이 된다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: mailpit
    receivers:
      - uid: mailpit-email
        type: email
        settings:
          addresses: ops@openmarket.local
          singleEmail: true

policies:
  - orgId: 1
    receiver: mailpit
    group_by: [grafana_folder, alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: openmarket
    folder: Open Market
    interval: 30s
    rules:
      - uid: openmarket-error-rate
        title: 오류율 급증
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 요청이 적을 때(초당 0.1건 미만) 한두 건의 5xx로 울리지 않게 한다.
              expr: >-
                (sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                / sum by (application) (rate(http_server_requests_seconds_count[5m])))
                and sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.application }} 5xx 비율 {{ humanizePercentage $values.A.Value }} (5분)"
          description: 서비스 RED 대시보드에서 엔드포인트를 찾고, X-Request-Id(trace id)로 Tempo·Loki를 본다.

      - uid: openmarket-latency-p95
        title: p95 지연 목표 초과
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 목표는 NFR-9의 주문 생성 p95 500ms다. actuator 스크레이프는 뺀다.
              expr: >-
                histogram_quantile(0.95, sum by (application, le)
                (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} p95 {{ humanizeDuration $values.A.Value }} (목표 500ms)"
          description: 서비스 RED 대시보드의 엔드포인트별 p95와 JVM 대시보드(GC, 커넥션 풀 대기)를 본다.

      - uid: openmarket-consumer-lag
        title: 소비자 지연 증가
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 리스너 소비자가 스스로 낸 파티션별 lag의 합. DLT 수집기(<토픽>.DLT)도 들어간다.
              expr: sum by (application, topic) (kafka_consumer_fetch_manager_records_lag)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}이(가) {{ $labels.topic }}에서 {{ $values.A.Value }}건 뒤처졌다(5분 넘게)"
          description: Kafka 대시보드의 이벤트 처리 지연과 서비스 오류, DB 커넥션 풀을 본다.

      - uid: openmarket-dead-letter
        title: DLT 유입
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 카운터는 처음 DLT로 보낼 때 1로 생겨 increase()가 0이 된다. 10분 전에 없던 시계열도 유입으로 본다.
              expr: >-
                sum by (application, topic, group) (increase(messaging_dead_letters_total[10m])) > 0
                or sum by (application, topic, group)
                (messaging_dead_letters_total unless messaging_dead_letters_total offset 10m)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.group }} 그룹이 {{ $labels.topic }} 메시지를 DLT로 보냈다(10분 안)"
          description: admin "DLT 메시지" 화면에서 원인을 보고 다시 보내거나 버린다(docs/architecture/messaging.md "DLT 재처리").

      - uid: openmarket-outbox-lag
        title: outbox 미발행 증가
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Debezium이 아직 확인하지 않은 WAL. outbox 행을 쓰고 발행하지 못하면 늘어난다. 정상이면 heartbeat로 따라온다.
              expr: >-
                max by (slot_name) (pg_replication_slots_slot_current_wal_lsn
                - pg_replication_slots_slot_confirmed_flush_lsn)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [16777216] }
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "복제 슬롯 {{ $labels.slot_name }}의 미확인 WAL {{ humanize1024 $values.A.Value }}B(3분 넘게 16MiB 초과)"
          description: connect 컨테이너와 커넥터 상태(curl localhost:8083/connectors/outbox/status)를 본다. 런북 "outbox 발행 멈춤".

      - uid: openmarket-replication-slot
        title: 복제 슬롯 무효
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # lost: 슬롯이 WAL을 잃었다. Debezium이 스스로 복구하지 못하고 발행이 멈춘다(risks.md R5·R16).
              # unreserved: max_slot_wal_keep_size를 넘어 곧 lost가 된다. 슬롯이 없으면(absent) 커넥터가 발행하지 않는다.
              expr: >-
                max by (slot_name, wal_status)
                (pg_replication_slots_wal_status{slot_name="openmarket_outbox", wal_status=~"lost|unreserved"})
                or absent(pg_replication_slots_slot_is_active{slot_name="openmarket_outbox"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # 새 스택은 Debezium이 슬롯을 만들기 전 1~2분 동안 슬롯이 없다.
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "복제 슬롯 openmarket_outbox 상태 {{ or $labels.wal_status \"없음\" }}"
          description: 자동으로 복구되지 않는다. 런북 "복제 슬롯 무효"대로 슬롯을 지우면 Debezium이 새로 만들고 남은 outbox 행을 다시 보낸다.
