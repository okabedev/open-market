# gateway 실행 설정. 공통 설정은 application.yml에 있다. 정책 근거는 docs/adr/0011-gateway-webflux.md와 docs/architecture/auth.md.
server:
  port: 8080
management:
  server:
    # actuator는 외부 진입점(8080)에 두지 않는다. Prometheus는 Eureka 메타데이터(management.port)로 이 포트를 찾는다.
    port: 8081
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # Redis가 죽으면 레이트 리미터는 요청을 통과시키지만, 기본 명령 타임아웃(60s)이면 그동안 모든 요청이 60초씩 멈춘다.
      timeout: 200ms
      connect-timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer와 JWK 주소는 공통 application.yml에 있다.
          # 사용자 토큰만 받는다. 서비스 간 토큰(aud=internal)은 gateway를 지나지 않는다.
          audiences: [shop, seller, admin]
          authorities-claim-name: roles
          authority-prefix: ROLE_
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          default-filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@clientKeyResolver}"
          # 서비스를 추가하면 라우트를 더한다(add-service skill). /api/<service>/** → lb://<service>, 접두어 두 단계를 뗀다.
          routes:
            # 가입·이메일 인증 API(공개). 기본 한도에 더해 엄격한 한도를 건다(NFR-5). 세 경로가 버킷 하나를 같이 쓴다.
            # 아래 auth 라우트보다 먼저 와야 한다. 로그인 화면과 OAuth2 엔드포인트는 브라우저가 auth(9000)에 직접 가고, 로그인 한도는 auth가 건다.
            - id: auth-signup
              uri: lb://auth
              predicates:
                - Method=POST
                - Path=/api/auth/v1/accounts,/api/auth/v1/accounts/email-verification,/api/auth/v1/accounts/email-verification/resend
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@strictKeyResolver}"
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
            - id: member
              uri: lb://member
              predicates:
                - Path=/api/member/**
              filters:
                - StripPrefix=2
            - id: catalog
              uri: lb://catalog
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2
            - id: order
              uri: lb://order
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=2
            - id: payment
              uri: lb://payment
              predicates:
                - Path=/api/payment/**
              filters:
                - StripPrefix=2
            - id: fulfillment
              uri: lb://fulfillment
              predicates:
                - Path=/api/fulfillment/**
              filters:
                - StripPrefix=2
            # 선착순 쿠폰 내려받기. 몰리는 요청이라 기본 한도에 더해 엄격한 한도를 건다(사용자마다). 아래 promotion 라우트보다 먼저 와야 한다.
            - id: promotion-issue
              uri: lb://promotion
              predicates:
                - Method=POST
                - Path=/api/promotion/v1/coupons/*/issue
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@strictKeyResolver}"
            - id: promotion
              uri: lb://promotion
              predicates:
                - Path=/api/promotion/**
              filters:
                - StripPrefix=2
            - id: review
              uri: lb://review
              predicates:
                - Path=/api/review/**
              filters:
                - StripPrefix=2
            - id: settlement
              uri: lb://settlement
              predicates:
                - Path=/api/settlement/**
              filters:
                - StripPrefix=2
            - id: notification
              uri: lb://notification
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2
            - id: search
              uri: lb://search
              predicates:
                - Path=/api/search/**
              filters:
                - StripPrefix=2
            - id: file
              uri: lb://file
              predicates:
                - Path=/api/file/**
              filters:
                - StripPrefix=2
            # 공개 이미지(docs/architecture/file.md "썸네일과 제공"). 경로를 그대로 넘긴다. 캐시 헤더는 file이 붙인다.
            - id: file-public
              uri: lb://file
              predicates:
                - Method=GET
                - Path=/files/**

openmarket:
  gateway:
    # 토큰 없이 통과시킬 경로. 판매자·관리자·내부 경로는 여기에 넣어도 공개되지 않는다.
    public-paths:
      # 가입과 이메일 인증(ACC-1). 로그인 전에 부른다.
      - method: POST
        pattern: /api/auth/v1/accounts
      - method: POST
        pattern: /api/auth/v1/accounts/email-verification
      - method: POST
        pattern: /api/auth/v1/accounts/email-verification/resend
      # 카테고리 트리와 구매자 상품 상세. catalog 쪽 public-paths(config-repo catalog.yml)에도 있다.
      - method: GET
        pattern: /api/catalog/v1/categories
      - method: GET
        pattern: /api/catalog/v1/products/**
      # 구매자 상품 검색과 자동완성. search 쪽 public-paths(config-repo search.yml)에도 있다.
      - method: GET
        pattern: /api/search/v1/products
      - method: GET
        pattern: /api/search/v1/suggestions
      # 내려받을 수 있는 쿠폰 목록과 쿠폰 한 건. promotion 쪽 public-paths(config-repo promotion.yml)에도 있다.
      - method: GET
        pattern: /api/promotion/v1/coupons
      - method: GET
        pattern: /api/promotion/v1/coupons/*
      # 상품 별점 요약과 상품 리뷰 목록. review 쪽 public-paths(config-repo review.yml)에도 있다.
      - method: GET
        pattern: /api/review/v1/products/*/rating-summary
      - method: GET
        pattern: /api/review/v1/products/*/reviews
      # 공개 이미지 변형. file 쪽 public-paths(config-repo file.yml)에도 있다.
      - method: GET
        pattern: /files/**
    # 사용자(sub) 또는 클라이언트 IP마다 토큰 버킷.
    rate-limit:
      replenish-rate: 20
      burst-capacity: 40
    # 라우트에 따로 거는 엄격한 한도(가입·이메일 인증, M5 쿠폰 발급). 라우트마다, 사용자 또는 IP마다 1분에 이만큼.
    # E2E만 환경 변수로 늘린다(infra/e2e/run.sh). 한 IP에서 판매자·구매자 계정을 1분 안에 여럿 만들기 때문이다.
    strict-rate-limit:
      requests-per-minute: ${GATEWAY_STRICT_RATE_LIMIT:5}
