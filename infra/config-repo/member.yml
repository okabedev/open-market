# member 실행 설정. 공통 설정은 application.yml에 있다.
server:
  port: 8101
spring:
  datasource:
    password: ${MEMBER_DB_PASSWORD}
  security:
    oauth2:
      client:
        # order 내부 API를 부를 서비스 간 토큰(client_credentials, scope internal). auth.yml의 service-clients와 같은 시크릿이다.
        registration:
          member:
            provider: auth
            client-id: member
            client-secret: ${MEMBER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          auth:
            token-uri: http://auth.openmarket.local:9000/oauth2/token
  cloud:
    openfeign:
      oauth2:
        enabled: true
        client-registration-id: member
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
      client:
        config:
          # 동기 조회의 타임아웃(NFR-4). 값과 이유는 order.yml과 같다.
          default:
            connect-timeout: 1000
            read-timeout: 2000
    circuitbreaker:
      resilience4j:
        # 호출을 요청 스레드에서 그대로 한다. 시간 제한은 위의 Feign 타임아웃이 맡는다.
        disable-time-limiter: true
        disable-thread-pool: true

resilience4j:
  circuitbreaker:
    configs:
      # 최근 호출 20건 중 10건 이상에서 절반이 실패하면 10초 동안 바로 실패시킨다(503). 4xx는 실패로 세지 않는다.
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException

openmarket:
  member:
    # 정산 계좌 번호 암호화 키(AES-256-GCM, Base64 32바이트). 바꾸면 저장된 계좌 번호를 복호화하지 못한다.
    account-number-key: ${MEMBER_ACCOUNT_NUMBER_KEY}
