# notification 실행 설정. 공통 설정은 application.yml에 있다.
server:
  port: 8202
spring:
  datasource:
    password: ${NOTIFICATION_DB_PASSWORD}
  kafka:
    consumer:
      group-id: notification
  mail:
    # 로컬은 Mailpit(인증 없음). 컨테이너로 띄우면 compose가 mailpit을 넣는다.
    host: ${MAIL_HOST:localhost}
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

openmarket:
  notification:
    mail-from: "오픈 마켓 <no-reply@openmarket.local>"
    # 보낼 차례인 메일을 찾는 주기(EmailDispatchJob)
    dispatch-interval: 2s
    # 인앱·이메일 알림 보관 기간과 정리 작업(NotificationPurgeJob) 주기
    retention: 90d
    purge-interval: 1h
