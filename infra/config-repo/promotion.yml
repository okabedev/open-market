# promotion 실행 설정. 공통 설정은 application.yml에 있다. 설계는 docs/architecture/promotion.md.
server:
  port: 8106
spring:
  datasource:
    password: ${PROMOTION_DB_PASSWORD}
  flyway:
    password: ${PROMOTION_DB_OWNER_PASSWORD}
  kafka:
    consumer:
      group-id: promotion
  data:
    redis:
      # 선착순 발급 게이트(docs/architecture/promotion.md "선착순 발급"). Redis가 죽으면 발급은 503이다(fail-closed).
      # 연결이 끊기면 명령을 바로 거절한다(RedisClientConfiguration). 명령 타임아웃은 연결된 Redis가 응답하지 않을 때만 걸린다.
      # 발급이 몰리면 promotion의 GC·CPU 지연으로 응답 처리가 1.4초까지 늦어져 500ms에서는 정상 응답도 503이 됐다(risks.md "부하 측정").
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
      connect-timeout: 500ms

openmarket:
  # 토큰 없이 여는 서비스 경로(common-security). gateway.yml의 public-paths에도 gateway 기준 경로로 적는다.
  security:
    public-paths:
      # 내려받을 수 있는 쿠폰 목록과 쿠폰 한 건(docs/architecture/promotion.md "API")
      - method: GET
        pattern: /v1/coupons
      - method: GET
        pattern: /v1/coupons/*
