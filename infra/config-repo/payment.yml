# payment 실행 설정. 공통 설정은 application.yml에 있다. 설계는 docs/architecture/payment.md.
server:
  port: 8104
spring:
  datasource:
    password: ${PAYMENT_DB_PASSWORD}
  flyway:
    password: ${PAYMENT_DB_OWNER_PASSWORD}
  kafka:
    consumer:
      group-id: payment

openmarket:
  payment:
    toss:
      # E2E는 가짜 PG 주소로 바꾼다(ADR 0018).
      base-url: ${TOSS_API_URL:https://api.tosspayments.com}
      # 시크릿 키는 payment만 갖는다. 브라우저에는 클라이언트 키만 간다.
      secret-key: ${TOSS_SECRET_KEY}
      connect-timeout: 2s
      read-timeout: 10s
    # 결제 재조회 작업(PaymentReconcileJob) 주기와, 승인 요청 뒤 재조회까지 기다리는 시간. 읽기 타임아웃보다 길어야 한다.
    reconcile-interval: 1m
    reconcile-after: 1m
    # 보상 취소 작업(PaymentCancelJob) 주기. 취소된 주문의 승인 결제를 토스에서 전액 취소한다. E2E만 환경 변수로 짧게 준다(infra/e2e/run.sh).
    cancel-interval: ${PAYMENT_CANCEL_INTERVAL:1m}
    # 환불 작업(RefundJob) 주기. 클레임 환불의 토스 부분취소를 부른다. E2E만 환경 변수로 짧게 준다(infra/e2e/run.sh).
    refund-interval: ${PAYMENT_REFUND_INTERVAL:1m}
