# pnpm 워크스페이스. 외부 패키지 버전은 아래 catalog에만 적고, 각 package.json은 `catalog:`로 참조한다.
# 버전 근거는 docs/adr/0012-frontend-toolchain.md에 있다.
packages:
  - apps/*
  - packages/*

catalog:
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  "@types/node": 24.19.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # 10은 eslint-config-next가 쓰는 eslint-plugin-react 7.37.5와 맞지 않는다(ADR 0012).
  eslint: 9.39.5
  eslint-config-next: 16.3.8
  eslint-config-prettier: 10.1.8
  prettier: 3.9.9
  vitest: 5.0.3
  vite: 8.3.2
  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
  server-only: 0.0.1
  # BFF 세션·OAuth2 클라이언트(ADR 0014)
  openid-client: 6.8.8
  redis: 6.3.0
  testcontainers: 12.2.0
  "@testcontainers/redis": 12.2.0
  # 화면(ADR 0015): Tailwind CSS, shadcn/ui 방식 컴포넌트(Radix 프리미티브), 폼 검증
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  "@radix-ui/react-slot": 1.3.3
  "@radix-ui/react-label": 2.1.15
  "@radix-ui/react-alert-dialog": 1.1.23
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  zod: 4.6.5
  # 컴포넌트 테스트(ADR 0015)
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/user-event": 14.6.7
  "@testing-library/jest-dom": 7.0.1
  jsdom: 30.1.1

# 의존성의 설치 스크립트는 여기서 허용한 것만 실행한다. 없는 패키지가 스크립트를 가지면 설치가 실패한다.
allowBuilds:
  # 네이티브 바인딩이 없을 때만 받는 대체 설치. 바인딩은 플랫폼별 선택 의존성으로 이미 들어온다.
  unrs-resolver: false
  # testcontainers(Docker API 클라이언트)의 의존성. 선택적 네이티브 가속과 설치 안내 스크립트라 없어도 동작한다.
  cpu-features: false
  ssh2: false
  protobufjs: false
