# 의존성 취약점 검사(ADR 0026). 필수 체크(`ci`)가 아니다. 새 공지가 상관없는 PR을 막지 않도록, PR에서는 lockfile이 바뀔 때만 돈다.
# - clients: `pnpm audit`이 npm 공지 DB에서 lockfile을 본다. GitHub 의존성 그래프는 pnpm lockfile(YAML 문서 두 개)을 읽지 못한다.
# - services: Gradle이 푼 의존성 그래프를 GitHub에 제출한다. 취약점은 Dependabot 알림(apply-settings.sh가 켠다)으로 온다.
# 일정 실행이 실패하면 GitHub가 저장소 관리자에게 메일을 보낸다.
# 액션은 ci.yml처럼 커밋 SHA로 고정하고, 배포 2주가 지난 릴리스를 쓴다(ADR 0009).
name: Dependencies

on:
  pull_request:
    paths:
      - clients/pnpm-lock.yaml
      - .github/workflows/dependencies.yml
  push:
    branches: [main]
    paths:
      - clients/pnpm-lock.yaml
      - services/**/*.gradle.kts
      - services/gradle/libs.versions.toml
      - .github/workflows/dependencies.yml
  schedule:
    # 매주 월요일 09:00(KST)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # 설치하지 않고 lockfile만 본다. low도 실패로 둔다(지금 0건).
      - run: pnpm audit --audit-level low

  gradle-dependency-submission:
    # 제출은 main의 그래프만 의미가 있다. PR에서는 돌리지 않는다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      # 테스트 클래스패스(Testcontainers 등)도 넣는다. 로컬에서 실행하는 코드다.
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: services
