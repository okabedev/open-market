# 변경 경로에 따라 백엔드·프론트·Compose 검사를 돌린다. 브랜치 보호의 필수 체크는 마지막 `ci` 잡 하나다.
# 건너뛴 잡은 통과로 본다. 그래서 경로 필터와 필수 체크가 함께 동작한다.
# 액션은 태그 대신 커밋 SHA로 고정하고 태그를 주석으로 남긴다. 올릴 때는 배포 2주가 지난 릴리스를 쓴다(ADR 0009와 같은 기준).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 멈춘다. main은 커밋마다 끝까지 돌린다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      clients: ${{ steps.filter.outputs.clients }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'services/**'
              # 백엔드 테스트가 이 OpenAPI 문서와 비교한다(OpenApiSnapshot).
              - 'clients/packages/api-client/openapi/**'
              - '.github/workflows/ci.yml'
            clients:
              - 'clients/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            compose:
              - 'compose.yaml'
              - 'infra/**'
              - '.env.example'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      # Gradle 캐시와 래퍼 검증. main에서만 캐시를 쓰고 PR은 읽기만 한다(기본 동작).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # 컴파일, 포맷, 정적 분석, 테스트(Testcontainers는 러너의 Docker를 쓴다).
      - run: ./gradlew build
      # convention 플러그인 회귀 테스트(Gradle TestKit).
      - run: ./gradlew -p build-logic test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            services/**/build/reports/tests/
            services/**/build/test-results/
          retention-days: 7

  clients:
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 버전은 clients/package.json의 packageManager를 읽는다.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/package.json
          cache: true
          cache_dependency_path: clients/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # 캐시는 pnpm/action-setup이 맡는다.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 커밋한 타입이 OpenAPI 문서에서 다시 만든 결과와 같은지 본다.
      - run: pnpm --filter @openmarket/api-client generate:check
      - run: pnpm build

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # compose 파일은 .env 값을 필수로 읽는다. 예시 값으로 문법과 변수 참조만 검사한다.
      - run: cp .env.example .env
      - run: docker compose --profile search --profile obs --profile apps config --quiet

  # 브랜치 보호의 필수 체크. 앞 잡 중 하나라도 실패하거나 취소되면 실패한다.
  ci:
    needs: [changes, backend, clients, compose]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "잡 결과: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done
