name: 기능
description: PRD 요구사항 하나를 구현한다
labels: ["type:feat"]
body:
  - type: input
    id: requirement
    attributes:
      label: 요구사항 ID
      description: docs/prd.md의 ID. 여러 개면 쉼표로 구분한다.
      placeholder: ORD-1, NFR-2
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: 마일스톤
      description: docs/roadmap.md
      options: [M0, M1, M2, M3, M4, M5, M6]
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: 유저스토리
      placeholder: 구매자로서 ...하고 싶다. 그래야 ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      description: 테스트로 확인할 수 있게 쓴다.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 설계 메모
      description: 새 용어(glossary.md), 이벤트(context-map.md), 스키마 변경, ADR이 필요한지 적는다.
